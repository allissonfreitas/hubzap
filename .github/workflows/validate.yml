name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node --check src/main.js
      - run: node --check src/preload.js
      - run: node --check src/renderer.js
      - run: node --check src/modern-shell.js
      - run: node --check src/modern.js
      - run: node --check src/outlook.js
