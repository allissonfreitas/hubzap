name: Build HubZap Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-linux.yml"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install packaging and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb libgtk-3-0 libnss3 libasound2 libgbm1
      - name: Install application dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Verify desktop interface on Linux
        run: xvfb-run --auto-servernum npm run smoke -- --no-sandbox
      - name: Build AppImage, DEB and RPM
        run: npm run dist:linux -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: HubZap-Linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux*.yml
          if-no-files-found: error
          retention-days: 30
