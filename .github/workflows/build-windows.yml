name: Build HubZap Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: |
          npm test
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/modern-shell.js
          node --check src/modern.js
          node --check src/outlook.js
          node --check src/stickers.js
          node --check src/sticker-capture.js
          node --check src/stickers-ui.js
          node --check src/updates.js
          node --check src/update-config.js
          node --check src/update-ui.js

      - name: Build Windows installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify permanent update channel and checksums
        run: node scripts/verify-update-artifacts.cjs win32

      - name: Upload HubZap installer
        uses: actions/upload-artifact@v4
        with:
          name: HubZap-Windows-Setup
          path: |
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
